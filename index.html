<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Wars — Team / Organisational Implementation Tracker</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f7f5;
    color: #1f1f1f;
    padding: 32px 40px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px 0; }
  .subtitle { color: #6b6b6b; font-size: 13px; margin-bottom: 20px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 8px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    text-align: left;
  }
  .card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.06); transform: translateY(-1px); }
  .card.active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .card .num { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .card .label { font-size: 12.5px; color: #6b6b6b; margin-top: 4px; }
  .card.total .num { color: #1f1f1f; }
  .card.completed .num { color: #178a4c; }
  .card.inprogress .num { color: #b06a00; }
  .card.notapplicable .num { color: #6b7280; }
  .card-note { font-size: 11.5px; color: #9aa1ac; font-style: italic; margin: 0 0 18px 2px; }

  .filters {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .filters .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .filters .row-label { font-size: 12.5px; color: #6b6b6b; margin-right: 4px; min-width: 110px; }
  .pill {
    border: 1px solid #dcdcd8;
    background: #fafafa;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    cursor: pointer;
    color: #333;
    white-space: nowrap;
  }
  .pill:hover { background: #f0f0ee; }
  .pill.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .clear-btn {
    margin-left: auto;
    font-size: 12px;
    color: #2563eb;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  .result-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .result-count { font-size: 13px; color: #6b6b6b; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e5e2; border-radius: 12px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: #6b6b6b;
    background: #fafaf8;
    padding: 10px 12px;
    border-bottom: 1px solid #e5e5e2;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #f0f0ee;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  td.sn { color: #6b6b6b; width: 34px; }
  td.details, td.remarks { max-width: 280px; }
  td.title { font-weight: 600; min-width: 150px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.completed { background: #e6f6ec; color: #178a4c; }
  .badge.inprogress { background: #fdf0dd; color: #b06a00; }
  .badge.notapplicable { background: #eceef2; color: #6b7280; }
  .combined-tag {
    display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700;
    color: #178a4c; background: #e6f6ec; padding: 2px 6px; border-radius: 999px;
  }
  .empty-state { padding: 40px; text-align: center; color: #999; font-size: 13px; }
  footer { margin-top: 24px; text-align: center; color: #bbb; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">

<h1>AGENT WARS — Team / Organisational Implementation</h1>
<div class="subtitle">Lithan Academy · 33 agent projects · Rollout status across teams and the organisation</div>

<div class="cards" id="cards"></div>
<div class="card-note" id="cardNote"></div>

<div class="filters">
  <div class="row">
    <span class="row-label">Filter by category</span>
    <div id="categoryPills" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    <button class="clear-btn" id="clearBtn">Clear all filters</button>
  </div>
</div>

<div class="result-bar">
  <div class="result-count" id="resultCount"></div>
</div>

<div id="tableWrap"></div>

<footer>Agent Wars · Lithan Academy</footer>
</div>

const STATUS_META = {
  completed:     { label: "Completed",      cls: "completed"     },
  inprogress:    { label: "In-progress",    cls: "inprogress"    },
  notapplicable: { label: "Not Applicable", cls: "notapplicable" },
};

const CATEGORIES = [
  "Administrative/Operations","Admissions","Communication & Reminders",
  "Grading & Assessment","Mentoring & Support","Monitoring & Tracking",
  "Coaching Agent","Other","Scheduling & Booking"
];

let activeStatus = null;
let activeCategory = null;

function counts() {
  const c = { completed:0, inprogress:0, notapplicable:0 };
  DATA.forEach(r => { c[r.impl.status]++; });
  return c;
}

function renderCards() {
  const c = counts();
  const cards = [
    { key: null, cls: "total", num: DATA.length, label: "Total agent projects" },
    { key: "completed", cls: "completed", num: c.completed, label: "Completed" },
    { key: "inprogress", cls: "inprogress", num: c.inprogress, label: "In-progress" },
    { key: "notapplicable", cls: "notapplicable", num: c.notapplicable, label: "Not Applicable" },
  ];
  document.getElementById("cards").innerHTML = cards.map(cd => `
    <div class="card ${cd.cls} ${activeStatus === cd.key ? 'active' : ''}" data-status="${cd.key ?? ''}">
      <div class="num">${cd.num}</div>
      <div class="label">${cd.label}</div>
    </div>
  `).join("");
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const s = el.getAttribute("data-status");
      activeStatus = s === "" ? null : s;
      render();
    });
  });
  document.getElementById("cardNote").textContent =
    `"Not Applicable" = individual-use only, redirected to support another agent's rollout, or folded into the combined Auto-grader project.`;
}

function renderCategoryPills() {
  const wrap = document.getElementById("categoryPills");
  wrap.innerHTML = CATEGORIES.map(cat => `
    <div class="pill ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>
  `).join("");
  wrap.querySelectorAll(".pill").forEach(el => {
    el.addEventListener("click", () => {
      const cat = el.getAttribute("data-cat");
      activeCategory = (activeCategory === cat) ? null : cat;
      render();
    });
  });
}

function renderTable() {
  let rows = DATA.slice();
  if (activeStatus) rows = rows.filter(r => r.impl.status === activeStatus);
  if (activeCategory) rows = rows.filter(r => r.cat === activeCategory);

  document.getElementById("resultCount").textContent =
    `${rows.length} agent${rows.length === 1 ? '' : 's'}` +
    (activeStatus ? ` · ${STATUS_META[activeStatus].label}` : '') +
    (activeCategory ? ` · ${activeCategory}` : '');

  if (rows.length === 0) {
    document.getElementById("tableWrap").innerHTML = `<div class="empty-state">No agents match this filter.</div>`;
    return;
  }

  const body = rows.map((r, i) => {
    const s = r.impl;
    return `
    <tr>
      <td class="sn">${i + 1}</td>
      <td>${r.cat}</td>
      <td>${r.staff}${r.team ? ` <span style="color:#999;font-size:11px;">(${r.team})</span>` : ''}</td>
      <td class="title">${r.title}${r.combined ? '<span class="combined-tag">COMBINED</span>' : ''}</td>
      <td class="details">${r.details || '<span style="color:#bbb;">—</span>'}</td>
      <td><span class="badge ${STATUS_META[s.status].cls}">${STATUS_META[s.status].label}</span></td>
      <td>${s.date || '<span style="color:#bbb;">—</span>'}</td>
      <td class="remarks">${s.remarks || '<span style="color:#bbb;">—</span>'}</td>
    </tr>
  `;
  }).join("");

  document.getElementById("tableWrap").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>SN</th><th>Category</th><th>Staff name</th><th>Agent title</th>
          <th>Details</th><th>Status</th><th>Live Date</th><th>Remarks</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function render() {
  renderCards();
  renderCategoryPills();
  renderTable();
}

document.getElementById("clearBtn").addEventListener("click", () => {
  activeStatus = null;
  activeCategory = null;
  render();
});

render();
</script>
</body>
</html>
