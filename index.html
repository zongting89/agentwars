  :root { color-scheme: light; }
  * { box-sizing: border-box; }

  .stage-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .stage-tab {
    flex: 1;
    background: #fff;
    border: 1.5px solid #e5e5e2;
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
  }
  .stage-tab:hover { box-shadow: 0 2px 10px rgba(0,0,0,.06); transform: translateY(-1px); }
  .stage-tab .num { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: #9aa1ac; }
  .stage-tab .name { font-size: 16.5px; font-weight: 700; color: #1f1f1f; margin-top: 2px; }
  .stage-tab .tag { font-size: 11.5px; margin-top: 4px; color: #6b6b6b; }
  .stage-tab.active { border-width: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  .stage-tab.active.s1 { border-color: #5A7D8C; }
  .stage-tab.active.s1 .num { color: #5A7D8C; }
  .stage-tab.active.s2 { border-color: #1E2761; }
  .stage-tab.active.s2 .num { color: #1E2761; }
  .stage-tab.active.s3 { border-color: #8B8FA3; }
  .stage-tab.active.s3 .num { color: #8B8FA3; }

  .cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    text-align: left;
  }
  .card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.06); transform: translateY(-1px); }
  .card.active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .card .num { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .card .label { font-size: 12.5px; color: #6b6b6b; margin-top: 4px; }
  .card.total .num { color: #1f1f1f; }
  .card.completed .num { color: #178a4c; }
  .card.inprogress .num { color: #b06a00; }
  .card.notapplicable .num { color: #6b7280; }
  .card.notstarted .num { color: #9aa1ac; }
  .card-note { font-size: 11.5px; color: #9aa1ac; font-style: italic; margin: -10px 0 18px 2px; }

  .filters {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .filters .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .filters .row-label { font-size: 12.5px; color: #6b6b6b; margin-right: 4px; min-width: 110px; }
  .pill {
    border: 1px solid #dcdcd8;
    background: #fafafa;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    cursor: pointer;
    color: #333;
    white-space: nowrap;
  }
  .pill:hover { background: #f0f0ee; }
  .pill.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .clear-btn {
    margin-left: auto;
    font-size: 12px;
    color: #2563eb;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  .result-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .result-count { font-size: 13px; color: #6b6b6b; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e5e2; border-radius: 12px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: #6b6b6b;
    background: #fafaf8;
    padding: 10px 12px;
    border-bottom: 1px solid #e5e5e2;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #f0f0ee;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  td.sn { color: #6b6b6b; width: 34px; }
  td.details, td.remarks { max-width: 250px; }
  td.title { font-weight: 600; min-width: 150px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.completed { background: #e6f6ec; color: #178a4c; }
  .badge.inprogress { background: #fdf0dd; color: #b06a00; }
  .badge.notapplicable { background: #eceef2; color: #6b7280; }
  .badge.notstarted { background: #f1f1f0; color: #9aa1ac; }
  .combined-tag {
    display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700;
    color: #178a4c; background: #e6f6ec; padding: 2px 6px; border-radius: 999px;
  }
  .stagedots { display: flex; gap: 5px; align-items: center; }
  .stagedot {
    width: 22px; height: 22px; border-radius: 6px; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .empty-state { padding: 40px; text-align: center; color: #999; font-size: 13px; }
  footer { margin-top: 24px; text-align: center; color: #bbb; font-size: 11px; }
</style>
</head>

  const c = { completed:0, inprogress:0, notapplicable:0, notstarted:0 };
  DATA.forEach(r => { const s = r[stageKey].status; c[s]++; });
  return c;
}

function renderStageTabs() {
  document.getElementById("stageTabs").innerHTML = STAGES.map(st => `
    <div class="stage-tab ${st.cls} ${activeStage === st.key ? 'active' : ''}" data-stage="${st.key}">
      <div class="num">${st.num}</div>
      <div class="name">${st.name}</div>
      <div class="tag">${st.tag}</div>
    </div>
  `).join("");
  document.querySelectorAll(".stage-tab").forEach(el => {
    el.addEventListener("click", () => {
      activeStage = el.getAttribute("data-stage");
      activeStatus = null;
      render();
    });
  });
}

function renderCards() {
  const c = counts(activeStage);
  const cards = [
    { key: null, cls: "total", num: DATA.length, label: "Total agent projects" },
    { key: "completed", cls: "completed", num: c.completed, label: "Completed" },
    { key: "inprogress", cls: "inprogress", num: c.inprogress, label: "In-progress" },
    { key: "notapplicable", cls: "notapplicable", num: c.notapplicable, label: "Not Applicable" },
    { key: "notstarted", cls: "notstarted", num: c.notstarted, label: "Not Started" },
  ];
  document.getElementById("cards").innerHTML = cards.map(cd => `
    <div class="card ${cd.cls} ${activeStatus === cd.key ? 'active' : ''}" data-status="${cd.key ?? ''}">
      <div class="num">${cd.num}</div>
      <div class="label">${cd.label}</div>
    </div>
  `).join("");
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const s = el.getAttribute("data-status");
      activeStatus = s === "" ? null : s;
      render();
    });
  });
  document.getElementById("cardNote").textContent =
    `"Not Applicable" = individual-use only or this stage isn't needed for the agent's function. Counts above reflect ${STAGES.find(s=>s.key===activeStage).name} (${STAGES.find(s=>s.key===activeStage).num}).`;
}

function renderCategoryPills() {
  const wrap = document.getElementById("categoryPills");
  wrap.innerHTML = CATEGORIES.map(cat => `
    <div class="pill ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>
  `).join("");
  wrap.querySelectorAll(".pill").forEach(el => {
    el.addEventListener("click", () => {
      const cat = el.getAttribute("data-cat");
      activeCategory = (activeCategory === cat) ? null : cat;
      render();
    });
  });
}

function stageDots(r) {
  return STAGES.map(st => {
    const s = r[st.key].status;
    const meta = STATUS_META[s];
    const bg = { completed: "#178a4c", inprogress: "#b06a00", notapplicable: "#9aa1ac", notstarted: "#d8dbe0" }[s];
    return `<div class="stagedot" style="background:${bg}" title="${st.name}: ${meta.label}">${st.key.toUpperCase().replace("S","S")}</div>`;
  }).join("");
}

function renderTable() {
  let rows = DATA.slice();
  const stMeta = STAGES.find(s => s.key === activeStage);
  if (activeStatus) rows = rows.filter(r => r[activeStage].status === activeStatus);
  if (activeCategory) rows = rows.filter(r => r.cat === activeCategory);

  document.getElementById("resultCount").textContent =
    `${rows.length} agent${rows.length === 1 ? '' : 's'} · ${stMeta.name}` +
    (activeStatus ? ` · ${STATUS_META[activeStatus].label}` : '') +
    (activeCategory ? ` · ${activeCategory}` : '');

  if (rows.length === 0) {
    document.getElementById("tableWrap").innerHTML = `<div class="empty-state">No agents match this filter.</div>`;
    return;
  }

  const body = rows.map((r, i) => {
    const s = r[activeStage];
    return `
    <tr>
      <td class="sn">${i + 1}</td>
      <td>${r.cat}</td>
      <td>${r.staff}${r.team ? ` <span style="color:#999;font-size:11px;">(${r.team})</span>` : ''}</td>
      <td class="title">${r.title}${r.combined ? '<span class="combined-tag">COMBINED</span>' : ''}</td>
      <td class="details">${r.details || '<span style="color:#bbb;">—</span>'}</td>
      <td><span class="badge ${STATUS_META[s.status].cls}">${STATUS_META[s.status].label}</span></td>
      <td>${s.date || '<span style="color:#bbb;">—</span>'}</td>
      <td class="remarks">${s.remarks || '<span style="color:#bbb;">—</span>'}</td>
      <td><div class="stagedots">${stageDots(r)}</div></td>
    </tr>
  `;
  }).join("");

  document.getElementById("tableWrap").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>SN</th><th>Category</th><th>Staff name</th><th>Agent title</th>
          <th>Details</th><th>${stMeta.name} Status</th><th>Live Date</th><th>Remarks</th><th>All Stages</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function render() {
  renderStageTabs();
  renderCards();
  renderCategoryPills();
  renderTable();
}

document.getElementById("clearBtn").addEventListener("click", () => {
  activeStatus = null;
  activeCategory = null;
  render();
});

render();
</script>
</body>
</html>
