<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Wars Implementation Tracker</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f7f5;
    color: #1f1f1f;
    padding: 32px 40px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px 0; }
  .subtitle { color: #6b6b6b; font-size: 13px; margin-bottom: 4px; }
  .asof { color: #999; font-size: 11.5px; margin-bottom: 18px; }
  .notice {
    background: #fff8e6;
    border: 1px solid #f0d99a;
    color: #7a5c00;
    font-size: 12.5px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    text-align: left;
  }
  .card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.06); transform: translateY(-1px); }
  .card.active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .card .num { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .card .label { font-size: 12.5px; color: #6b6b6b; margin-top: 4px; }
  .card.total .num { color: #1f1f1f; }
  .card.completed .num { color: #178a4c; }
  .card.inprogress .num { color: #b06a00; }
  .card.pending .num { color: #b02a2a; }
  .card.notstarted .num { color: #6b6b6b; }

  .filters {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .filters .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .filters .row-label { font-size: 12.5px; color: #6b6b6b; margin-right: 4px; min-width: 110px; }
  .pill {
    border: 1px solid #dcdcd8;
    background: #fafafa;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    cursor: pointer;
    color: #333;
    white-space: nowrap;
  }
  .pill:hover { background: #f0f0ee; }
  .pill.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .clear-btn {
    margin-left: auto;
    font-size: 12px;
    color: #2563eb;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  .result-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .result-count { font-size: 13px; color: #6b6b6b; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e5e2; border-radius: 12px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: #6b6b6b;
    background: #fafaf8;
    padding: 10px 12px;
    border-bottom: 1px solid #e5e5e2;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #f0f0ee;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  td.sn { color: #6b6b6b; width: 34px; }
  td.details, td.remarks { max-width: 280px; }
  td.title { font-weight: 600; min-width: 150px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.completed { background: #e6f6ec; color: #178a4c; }
  .badge.inprogress { background: #fdf0dd; color: #b06a00; }
  .badge.pending { background: #fbe6e6; color: #b02a2a; }
  .badge.notstarted { background: #eee; color: #6b6b6b; }
  .unverified-tag { font-size: 10.5px; color: #b06a00; margin-left: 5px; }
  .empty-state { padding: 40px; text-align: center; color: #999; font-size: 13px; }
  footer { margin-top: 24px; text-align: center; color: #bbb; font-size: 11px; }
  @media print {
    .filters, .clear-btn { display: none; }
    body { padding: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

<h1>AGENT WARS — Implementation Tracker</h1>
<div class="subtitle">Lithan Academy · 29 submissions · click a status card, then optionally narrow by category</div>

<div class="cards" id="cards"></div>

<div class="filters">
  <div class="row">
    <span class="row-label">Filter by category</span>
    <div id="categoryPills" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    <button class="clear-btn" id="clearBtn">Clear all filters</button>
  </div>
</div>

<div class="result-bar">
  <div class="result-count" id="resultCount"></div>
</div>

<div id="tableWrap"></div>

<footer>Agent Wars · Lithan Academy</footer>
</div>
<script>
const DATA = [
{sn:1,cat:"Administrative/Operations",staff:"Chandrashekhar Kumbhar",team:"",title:"Assessment Control Agent for Lithan",details:"A menu-driven bot that manages faculty confirmations, learner bookings, reminders, and status checks with auto-saved data in tables.",status:"notstarted",date:"",remarks:"It is combined with SN 12."},

{sn:8,cat:"Communication & Reminders",staff:"Arvinder Kaur",team:"",title:"AI Autograder",details:"AI-Autograder is an intelligent grading agent that automatically evaluates student submissions using assignment instructions, rubrics, and predefined prompts. The system accepts multiple file formats such as PDF, DOCX, and ZIP files containing source code.",status:"inprogress",date:"30-Jun-26",remarks:"Demonstrated with Salil."},
{sn:9,cat:"Communication & Reminders",staff:"Ma Victoria A Capisonda",team:"Admissions",title:"EnrollHub Connect",details:"The Agent Dashboard will support the following functions: post in MS Teams the list of students joining a specific class/intake, including the student's email address, consultant name, enrollment status, and sponsored company (if applicable), for the...",status:"inprogress",date:"31-Jul-26",remarks:""},
{sn:10,cat:"Communication & Reminders",staff:"Joanna Ng Wai Li Ng",team:"",title:"TrackMate",details:"TrackMate is an automated reminder system that prompts learners to provide and commit to their submission date within the stipulated module timeframe.",status:"notstarted",date:"",remarks:""},
{sn:11,cat:"Communication & Reminders",staff:"Ariel Marie Gaffud",team:"LS",title:"Virtual Dashboard Agent",details:"My Virtual Agent is an automated assistant integrated with Microsoft Teams, Microsoft Power BI, and the LMS to help monitor and manage training operations. It checks if cohort codes are created, verifies if Teams session links are embedded in the LMS, and confirms whether all...",status:"notstarted",date:"NA",remarks:"Feasibility concern."},
{sn:12,cat:"Grading & Assessment",staff:"Jehan",team:"",title:"Auto scheduler for OA",details:"Update from OA vendor side: OA vendor (Nirav) would be providing an API key for the online assessment portal so that we can connect it to OA to schedule assessments automatically on the back end. Current state: vendor is almost done with this requirement and will provide a cost estimate. Will follow up via email.",status:"inprogress",date:"",remarks:""},

{sn:16,cat:"Grading & Assessment",staff:"Saroja Krishnamurthy",team:"",title:"EduMentor AI",details:"EduMentor AI is an Agentic AI-powered academic mentoring assistant designed to automate student support and academic workflow operations, combining conversational AI, Retrieval-Augmented Generation (RAG), document-based knowledge retrieval, email drafting, Outlook calendar automation, and Voice AI. Built on Flowise, Ollama, FAISS and Power Automate. Capabilities include clarifying student doubts from uploaded academic documents, assignment guidance, auto-generating academic emails, scheduling mentoring meetings, voice-based interaction (STT/TTS), and knowledge-based answers via the EduMentor Knowledge Voice Assistant (RAG). Additionally working on an AI-Powered Rubric-Based Assessment and Feedback System that combines document processing, rubric-based evaluation, LLMs and automated report generation to score submissions and produce downloadable evaluation reports.",status:"inprogress",date:"30-Jun-26",remarks:"Demonstrated with Salil."},

{sn:18,cat:"Mentoring & Support",staff:"Madhavi Mhatre",team:"LS",title:"Resumption and Addendum Monitoring System",details:"Additionally, working on an AI-Powered Rubric-Based Assessment and Feedback System.",status:"completed",date:"4-Jun-26",remarks:""},
{sn:19,cat:"Mentoring & Support",staff:"Khin Ma Ma Cho",team:"",title:"Faculty Grading Assistant",details:"AI-powered grading assistant that evaluates learner submissions against rubric criteria using a hybrid Rule-Based + OpenAI GPT approach. The system extracts assignment content, matches evidence against assessment criteria, generates grades, feedback, and recommendations, and provides consistent assessment support to faculty while reducing grading time.",status:"inprogress",date:"",remarks:"Demonstrated with Salil. In progress."},
{sn:20,cat:"Monitoring & Tracking",staff:"Myo Kyaw Oo",team:"",title:"Ache AI",details:"Assignment Checker.",status:"inprogress",date:"",remarks:"Demostrated with Salil. In progress."},
{sn:21,cat:"Monitoring & Tracking",staff:"R Sridevi",team:"",title:"Learner Payment Analyser Agent - For International",details:"To send reminders to learners on their instalment payments.",status:"inprogress",date:"31-Jul-26",remarks:""},
{sn:22,cat:"Monitoring & Tracking",staff:"Sarvan Kumar",team:"",title:"AI Grading Agent",details:"Design and implement an AI-enabled assessment system that combines document processing, rubric-based evaluation, Large Language Models (LLMs), and automated report generation. The solution evaluates student submissions against assessment criteria, assigns scores, generates detailed feedback and recommendations, and produces downloadable evaluation reports, significantly reducing faculty grading time while maintaining assessment consistency.",status:"inprogress",date:"31-Jul-26",remarks:"Demonstrated with Salil; as most of Auto Grader is combined, currently working on Masters Grade Generator Assistant (agent) for MTCS."},
{sn:23,cat:"Monitoring & Tracking",staff:"Ei Thandar Khaing",team:"",title:"LIA Agentic AI",details:"The platform acts as an AI-powered operational and instructional intelligence assistant for Learning & Delivery teams. Key capabilities: AI meeting transcript analysis, automated management reporting, stakeholder email generation, curriculum and IU analysis, AI-generated instructi...",status:"inprogress",date:"",remarks:"Demonstrated and discussed with Salil. He said Noel will discuss soon."},
{sn:24,cat:"Monitoring & Tracking",staff:"Benjamin Liu",team:"",title:"Email Sentiment & Draft Assistant",details:"This agent supports email handling by automatically analyzing incoming messages and identifying their tone or urgency. It sends a Teams notification with a short summary so I can quickly understand which emails may need attention.",status:"notstarted",date:"",remarks:""},
{sn:25,cat:"Monitoring & Tracking",staff:"Goh Yee Jing",team:"",title:"Submission Watcher",details:"Submission Watcher is a browser-based intelligence agent that identifies learners with missing MCQs and assignments/projects from LMS CSV files. It supports multiple file uploads, automatically groups results by class, and provides searchable and filterable views for easy follow-up.",status:"notstarted",date:"",remarks:"The LMS does not provide a submission report. Submission Watcher uses available grading report data to identify missing submissions instead. Auto Grader integration can be considered as a future enhancement for submission status visibility. Closed for now."},

{sn:27,cat:"Scheduling & Booking",staff:"Nur Ayuni Binte Rahmat",team:"LS",title:"Assistant Agent",details:"An AI-powered daily operations assistant that streamlines routine administrative tasks and workflows.",status:"notstarted",date:"NA",remarks:"On-hold. PDPA concern."},
{sn:28,cat:"Scheduling & Booking",staff:"Anusha",team:"",title:"Mentor Sync",details:"MentorSync is a dual-access AI platform. Provides assignment feedback with estimated grades and areas for improvement. Sends assignment deadline reminders integrated into Microsoft Teams through automated workflows. Offers portfolio-building guidance with profession-specific AI responses. Generates instant placement eligibility scores with KPI breakdown sent to the Talent Team. Enables mentors to track learner usage patterns and performance metrics across all four categories for data-driven, timely responses and scalable cohort intervention.",status:"inprogress",date:"",remarks:"Checked with John and the team. This is expected to be implemented as add-on features in CLaaS Mentor or CLaaS Manager. If it is a standalone app, it will be considered for the development pipeline. The completion date is yet to be determined."},
{sn:29,cat:"Scheduling & Booking",staff:"Claudie Sarmiento",team:"Admissions",title:"Enterprise Enrolment Agent",details:"The agent automates and transforms the company-sponsored enrolment data submitted through Microsoft Forms. Upon form submission, the data is stored in SharePoint, where Power Automate processes the records, validates required fields, reformats data where necessary, and generate...",status:"completed",date:"5-Jun-26",remarks:""},
];

const STATUS_META = {
  completed:  { label: "Completed",           cls: "completed"  },
  inprogress: { label: "In-progress",         cls: "inprogress" },
  pending:    { label: "Pending instructions",cls: "pending"    },
  notstarted: { label: "Not yet started",     cls: "notstarted" },
};

const CATEGORIES = [
  "Administrative/Operations","Admissions","Communication & Reminders",
  "Grading & Assessment","Mentoring & Support","Monitoring & Tracking",
  "Other","Scheduling & Booking"
];

let activeStatus = null;
let activeCategory = null;

function counts() {
  const c = { completed:0, inprogress:0, pending:0, notstarted:0 };
  DATA.forEach(r => c[r.status]++);
  return c;
}

function renderCards() {
  const c = counts();
  const cards = [
    { key: null, cls: "total", num: DATA.length, label: "Total no. of agents" },
    { key: "completed", cls: "completed", num: c.completed, label: "Completed" },
    { key: "inprogress", cls: "inprogress", num: c.inprogress, label: "In-progress" },
    { key: "pending", cls: "pending", num: c.pending, label: "Pending instructions" },
    { key: "notstarted", cls: "notstarted", num: c.notstarted, label: "Not yet started" },
  ];
  document.getElementById("cards").innerHTML = cards.map(cd => `
    <div class="card ${cd.cls} ${activeStatus === cd.key ? 'active' : ''}" data-status="${cd.key ?? ''}">
      <div class="num">${cd.num}</div>
      <div class="label">${cd.label}</div>
    </div>
  `).join("");
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const s = el.getAttribute("data-status");
      activeStatus = s === "" ? null : s;
      render();
    });
  });
}

function renderCategoryPills() {
  const wrap = document.getElementById("categoryPills");
  wrap.innerHTML = CATEGORIES.map(cat => `
    <div class="pill ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>
  `).join("");
  wrap.querySelectorAll(".pill").forEach(el => {
    el.addEventListener("click", () => {
      const cat = el.getAttribute("data-cat");
      activeCategory = (activeCategory === cat) ? null : cat;
      render();
    });
  });
}

function renderTable() {
  let rows = DATA.slice();
  if (activeStatus) rows = rows.filter(r => r.status === activeStatus);
  if (activeCategory) rows = rows.filter(r => r.cat === activeCategory);

  document.getElementById("resultCount").textContent =
    `${rows.length} agent${rows.length === 1 ? '' : 's'}` +
    (activeStatus ? ` · ${STATUS_META[activeStatus].label}` : '') +
    (activeCategory ? ` · ${activeCategory}` : '');

  if (rows.length === 0) {
    document.getElementById("tableWrap").innerHTML = `<div class="empty-state">No agents match this filter.</div>`;
    return;
  }

  const body = rows.map((r, i) => `
    <tr>
      <td class="sn">${i + 1}</td>
      <td>${r.cat}</td>
      <td>${r.staff}${r.team ? ` <span style="color:#999;font-size:11px;">(${r.team})</span>` : ''}</td>
      <td class="title">${r.title}</td>
      <td class="details">${r.details || '<span style="color:#bbb;">—</span>'}</td>
      <td><span class="badge ${STATUS_META[r.status].cls}">${STATUS_META[r.status].label}</span></td>
      <td>${r.date || '<span style="color:#bbb;">—</span>'}</td>
      <td class="remarks">${r.remarks || '<span style="color:#bbb;">—</span>'}</td>
    </tr>
  `).join("");

  document.getElementById("tableWrap").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>SN</th><th>Category</th><th>Staff name</th><th>Agent title</th>
          <th>Details</th><th>Status</th><th>Effective date</th><th>Remarks</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function render() {
  renderCards();
  renderCategoryPills();
  renderTable();
}

document.getElementById("clearBtn").addEventListener("click", () => {
  activeStatus = null;
  activeCategory = null;
  render();
});

render();
</script>
</body>
</html>
