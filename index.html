// Parses dates like "31-Jul-26" into a comparable timestamp.
// Returns null for blank values or non-date strings like "TBC".
function parseLiveDate(str) {
  if (!str) return null;
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2})$/.exec(str.trim());
  if (!m) return null;
  const months = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
  const mon = months[m[2]];
  if (mon === undefined) return null;
  const day = parseInt(m[1], 10);
  const year = 2000 + parseInt(m[3], 10);
  return new Date(year, mon, day).getTime();
}

function sortValue(r, col) {
  switch (col) {
    case "sn": return r.sn;
    case "cat": return (r.cat || "").toLowerCase();
    case "staff": return (r.staff || "").toLowerCase();
    case "title": return (r.title || "").toLowerCase();
    case "details": return (r.details || "").toLowerCase();
    case "status": return (STATUS_META[r.impl.status]?.label || "").toLowerCase();
    case "date": return parseLiveDate(r.impl.date);
    case "remarks": return (r.impl.remarks || "").toLowerCase();
    default: return null;
  }
}

    const va = sortValue(a.r, sortColumn);
    const vb = sortValue(b.r, sortColumn);
    const aEmpty = va === null || va === undefined || va === "";
    const bEmpty = vb === null || vb === undefined || vb === "";
    // blanks/unparseable values always sort to the end, regardless of direction
    if (aEmpty && bEmpty) return a.i - b.i;
    if (aEmpty) return 1;
    if (bEmpty) return -1;
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return a.i - b.i;
  });
  return withIdx.map(x => x.r);
}

function counts() {
  const c = { completed:0, inprogress:0, notapplicable:0 };
  DATA.forEach(r => { c[r.impl.status]++; });
  return c;
}

function renderCards() {
  const c = counts();
  const cards = [
    { key: null, cls: "total", num: DATA.length, label: "Total agent projects" },
    { key: "completed", cls: "completed", num: c.completed, label: "Completed" },
    { key: "inprogress", cls: "inprogress", num: c.inprogress, label: "In-progress" },
    { key: "notapplicable", cls: "notapplicable", num: c.notapplicable, label: "Not Applicable" },
  ];
  document.getElementById("cards").innerHTML = cards.map(cd => `
    <div class="card ${cd.cls} ${activeStatus === cd.key ? 'active' : ''}" data-status="${cd.key ?? ''}">
      <div class="num">${cd.num}</div>
      <div class="label">${cd.label}</div>
    </div>
  `).join("");
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const s = el.getAttribute("data-status");
      activeStatus = s === "" ? null : s;
      render();
    });
  });
  document.getElementById("cardNote").textContent =
    `"Not Applicable" = individual-use only, redirected to support another agent's rollout, or folded into the combined Auto-grader project.`;
}

function renderCategoryPills() {
  const wrap = document.getElementById("categoryPills");
  wrap.innerHTML = CATEGORIES.map(cat => `
    <div class="pill ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>
  `).join("");
  wrap.querySelectorAll(".pill").forEach(el => {
    el.addEventListener("click", () => {
      const cat = el.getAttribute("data-cat");
      activeCategory = (activeCategory === cat) ? null : cat;
      render();
    });
  });
}

function renderTable() {
  let rows = DATA.slice();
  if (activeStatus) rows = rows.filter(r => r.impl.status === activeStatus);
  if (activeCategory) rows = rows.filter(r => r.cat === activeCategory);
  rows = applySort(rows);

  document.getElementById("resultCount").textContent =
    `${rows.length} agent${rows.length === 1 ? '' : 's'}` +
    (activeStatus ? ` · ${STATUS_META[activeStatus].label}` : '') +
    (activeCategory ? ` · ${activeCategory}` : '') +
    (sortColumn ? ` · sorted by ${COLUMNS.find(c => c.key === sortColumn).label} (${sortDirection === 'asc' ? 'A–Z' : 'Z–A'})` : '');

  if (rows.length === 0) {
    document.getElementById("tableWrap").innerHTML = `<div class="empty-state">No agents match this filter.</div>`;
    return;
  }

  const body = rows.map((r, i) => {
    const s = r.impl;
    return `
    <tr>
      <td class="sn">${r.sn}</td>
      <td>${r.cat}</td>
      <td>${r.staff}${r.team ? ` <span style="color:#999;font-size:11px;">(${r.team})</span>` : ''}</td>
      <td class="title">${r.title}${r.combined ? '<span class="combined-tag">COMBINED</span>' : ''}</td>
      <td class="details">${r.details || '<span style="color:#bbb;">—</span>'}</td>
      <td><span class="badge ${STATUS_META[s.status].cls}">${STATUS_META[s.status].label}</span></td>
      <td>${s.date || '<span style="color:#bbb;">—</span>'}</td>
      <td class="remarks">${s.remarks || '<span style="color:#bbb;">—</span>'}</td>
    </tr>
  `;
  }).join("");

  const headCells = COLUMNS.map(c => {
    const isSorted = sortColumn === c.key;
    const arrow = isSorted ? (sortDirection === "asc" ? "▲" : "▼") : "⇅";
    return `<th class="${isSorted ? 'sorted' : ''}" data-col="${c.key}">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
  }).join("");

  document.getElementById("tableWrap").innerHTML = `
    <table>
      <thead>
        <tr>${headCells}</tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  `;

  document.querySelectorAll("thead th").forEach(el => {
    el.addEventListener("click", () => {
      const col = el.getAttribute("data-col");
      if (sortColumn === col) {
        sortDirection = sortDirection === "asc" ? "desc" : "asc";
      } else {
        sortColumn = col;
        sortDirection = "asc";
      }
      renderTable();
    });
  });
}

// ---- "Completed & Live This Week" panel + live clock ----
function getWeekRange(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(date);
  monday.setHours(0, 0, 0, 0);
  monday.setDate(date.getDate() + diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return { monday, sunday };
}

function renderWeekPanel() {
  const now = new Date();
  const { monday, sunday } = getWeekRange(now);
  const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

  const liveThisWeek = DATA.filter(r => {
    if (r.impl.status !== 'completed') return false;
    const t = parseLiveDate(r.impl.date);
    return t !== null && t >= monday.getTime() && t <= sunday.getTime();
  }).sort((a, b) => parseLiveDate(a.impl.date) - parseLiveDate(b.impl.date));

  const listHtml = liveThisWeek.length
    ? `<div class="week-grid">${liveThisWeek.map(r => `
        <div class="week-item">
          <div class="wi-top">
            <span class="wi-title">${r.title}</span>
            <span class="wi-date">${r.impl.date}</span>
          </div>
          <div class="wi-meta">${r.staff}${r.team ? ` · ${r.team}` : ''} · ${r.cat}</div>
        </div>
      `).join("")}</div>`
    : `<div class="week-empty">No agents have gone live yet this week — check back soon.</div>`;

  document.getElementById("weekPanel").innerHTML = `
    <div class="week-panel-head">
      <div class="week-panel-title">🎉 Agents Completed &amp; Live This Week</div>
      <div class="week-panel-range">${fmt(monday)} – ${fmt(sunday)}</div>
    </div>
    ${listHtml}
  `;
}

function tickClock() {
  const el = document.getElementById("liveClock");
  if (!el) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  el.textContent = `${dateStr} · ${timeStr}`;
}

function render() {
  renderCards();
  renderCategoryPills();
  renderTable();
  renderWeekPanel();
}

document.getElementById("clearBtn").addEventListener("click", () => {
  activeStatus = null;
  activeCategory = null;
  render();
});

render();
tickClock();
setInterval(tickClock, 1000);
</script>
</body>
</html>
